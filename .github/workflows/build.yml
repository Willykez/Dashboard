name: CSVERSE Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Export Expo web build
        run: npm run build
        env:
          EXPO_PUBLIC_BASE_URL: /

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: csverse-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
